name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Test
        run: pytest --cov=newsroom --cov-report=xml --cov-report=term
      - name: Smoke-test CLI
        run: |
          newsroom generate-corpus --n-docs 300 --output /tmp/corpus.csv
          newsroom train --input /tmp/corpus.csv --output /tmp/clf.joblib --no-grid-search
          newsroom build-index --input /tmp/corpus.csv --output /tmp/index
          newsroom search --index /tmp/index "quarterly earnings beat expectations" --top-k 3
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t newsroom-nlp:ci .
