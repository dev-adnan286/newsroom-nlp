[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom-nlp"
version = "0.1.0"
description = "Text-intelligence toolkit and API for news articles: preprocessing, classification, embeddings, semantic search, keywords, topics and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adnan" }]
keywords = ["nlp", "news", "classification", "semantic-search", "bm25", "textrank", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<1.8",
    "scipy>=1.11,<2",
    "joblib>=1.3,<2",
    "pyyaml>=6.0,<7",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "typer>=0.12,<1",
    "rich>=13.0,<15",
    "matplotlib>=3.8,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.4,<1",
    "black>=24.0,<26",
    "mypy>=1.9,<2",
    "types-PyYAML>=6.0",
]
transformers = [
    "sentence-transformers>=2.6,<4",
    "torch>=2.1",
]
nltk = ["nltk>=3.8,<4"]
umap = ["umap-learn>=0.5,<1"]

[project.scripts]
newsroom = "newsroom.cli:app"

[project.urls]
Homepage = "https://github.com/adnan/newsroom-nlp"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsroom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["newsroom"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.12"
packages = ["newsroom"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
